[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-interview-mcp"
version = "0.1.0"
description = "A resumable, elicitation-first MCP resume interview and PDF builder"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "reportlab>=4.2,<5", "pypdf>=5,<7"]

[project.scripts]
resume-interview-mcp = "resume_mcp.server:main"

[tool.setuptools.packages.find]
include = ["resume_mcp*"]
